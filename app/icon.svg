<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stackora-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="stackora-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Aura Glow Filter -->
    <filter id="aura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Layer 1 Gradient (Top - Cyan Aura) -->
    <linearGradient id="top-layer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Layer 2 Gradient (Middle - Indigo Stack) -->
    <linearGradient id="mid-layer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Layer 3 Gradient (Bottom - Deep Ocean Base) -->
    <linearGradient id="bot-layer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Ambient Glow Radial -->
    <radialGradient id="ambient-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#stackora-bg)" stroke="url(#stackora-border)" stroke-width="4" />

  <!-- Ambient Aura behind the Stack -->
  <circle cx="256" cy="256" r="180" fill="url(#ambient-aura)" filter="url(#aura-glow)" />

  <!-- STACK LAYER 3 (Bottom Layer) -->
  <g transform="translate(0, 150)">
    <!-- 3D Under Thickness -->
    <path d="M 124 168 L 246 226 C 252 229 260 229 266 226 L 388 168 L 388 192 C 388 198 384 204 378 207 L 264 261 C 258 264 254 264 248 261 L 134 207 C 128 204 124 198 124 192 Z" fill="#172554" />
    <!-- Top Face -->
    <path d="M 248 113 C 253 111 259 111 264 113 L 378 167 C 385 170 385 178 378 181 L 264 235 C 259 237 253 237 248 235 L 134 181 C 127 178 127 170 134 167 Z" fill="url(#bot-layer)" opacity="0.85" />
  </g>

  <!-- STACK LAYER 2 (Middle Layer) -->
  <g transform="translate(0, 75)">
    <!-- 3D Under Thickness -->
    <path d="M 124 168 L 246 226 C 252 229 260 229 266 226 L 388 168 L 388 192 C 388 198 384 204 378 207 L 264 261 C 258 264 254 264 248 261 L 134 207 C 128 204 124 198 124 192 Z" fill="#312e81" />
    <!-- Top Face -->
    <path d="M 248 113 C 253 111 259 111 264 113 L 378 167 C 385 170 385 178 378 181 L 264 235 C 259 237 253 237 248 235 L 134 181 C 127 178 127 170 134 167 Z" fill="url(#mid-layer)" />
  </g>

  <!-- STACK LAYER 1 (Top Floating Layer with High Glow) -->
  <g transform="translate(0, 0)">
    <!-- 3D Under Thickness -->
    <path d="M 124 168 L 246 226 C 252 229 260 229 266 226 L 388 168 L 388 192 C 388 198 384 204 378 207 L 264 261 C 258 264 254 264 248 261 L 134 207 C 128 204 124 198 124 192 Z" fill="#0369a1" />
    <!-- Top Face -->
    <path d="M 248 113 C 253 111 259 111 264 113 L 378 167 C 385 170 385 178 378 181 L 264 235 C 259 237 253 237 248 235 L 134 181 C 127 178 127 170 134 167 Z" fill="url(#top-layer)" />
    <!-- Subtle Inner Highlight Line -->
    <path d="M 256 122 L 366 174 L 256 226 L 146 174 Z" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" fill="none" />
  </g>

  <!-- Orbiting Sparkle / Light Accent (Top Right) -->
  <path d="M 390 120 C 392 127 397 132 404 134 C 397 136 392 141 390 148 C 388 141 383 136 376 134 C 383 132 388 127 390 120 Z" fill="#38bdf8" />
  <circle cx="390" cy="134" r="2" fill="#ffffff" />
</svg>